[phases.setup]
nixPkgs = ["php85", "php85Extensions.pdo", "php85Extensions.pdo_mysql", "php85Extensions.mbstring", "php85Extensions.xml", "php85Extensions.curl", "php85Extensions.zip", "php85Extensions.gd", "php85Extensions.bcmath", "nodejs_20", "npm-9_x"]

[phases.install]
cmds = [
    "composer install --no-interaction --prefer-dist --optimize-autoloader --no-dev",
    "npm install",
    "npm run build"
]

[phases.build]
cmds = [
    "php artisan config:clear",
    "php artisan route:clear",
    "php artisan view:clear"
]

[start]
cmd = "php artisan migrate --force && php artisan db:seed --class=AdminUserSeeder --force && php artisan storage:link --force && php -c php.ini artisan serve --host=0.0.0.0 --port=$PORT"